name: ha-integration

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install library + Home Assistant test stack
        run: pip install -e ".[dev,ha]"
      - name: Vendored aiounas is in sync with src/
        run: |
          python scripts/vendor_aiounas.py
          git diff --exit-code custom_components/unifi_unas_rest/aiounas
      - name: Type check integration (Python 3.14, strict)
        run: mypy --strict --python-version 3.14 custom_components/unifi_unas_rest
      - name: Integration tests
        run: PYTHONPATH=. pytest tests_ha/
