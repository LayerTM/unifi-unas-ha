name: hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately not pinned. These validate against what Home Assistant and
      # HACS require *today*, so a pin freezes the check rather than the code it
      # runs — and its newest release tag (1.0.0, from 2020) long predates the
      # branch it publishes from, so an updater would move a pin backwards.
      - uses: home-assistant/actions/hassfest@master
