name: hacs

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The registry answers `toomanyrequests` to anonymous pulls often enough to
      # colour a run red before any of our code runs. The runner does retry an
      # action image three times, but backs off only 1-10 seconds, so all three
      # attempts land inside one rate-limit window. Warm the image first, spread
      # over a minute: the runner's own pull then follows a window that has just
      # proven good, with the layers already local. Best effort by design — a
      # failure here is left to the step below, which is the real gate.
      - name: Warm the action image cache
        run: |
          image=ghcr.io/hacs/action:main  # what hacs/action runs
          for attempt in 1 2 3; do
            if docker pull --quiet "$image"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::notice::pull attempt $attempt failed for $image; retrying in 30s"
              sleep 30
            fi
          done
          echo "::warning::could not pre-pull $image after 3 attempts"
      # Deliberately not pinned. These validate against what Home Assistant and
      # HACS require *today*, so a pin freezes the check rather than the code it
      # runs — and its newest release tag (22.5.0, from 2022) long predates the
      # branch it publishes from, so an updater would move a pin backwards.
      - uses: hacs/action@main
        with:
          category: integration
