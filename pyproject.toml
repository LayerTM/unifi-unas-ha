[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiounas"
version = "1.7.4"
description = "Async client for the Ubiquiti UniFi UNAS (UniFi Drive) local REST API — non-invasive monitoring with opt-in control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "LayerTM" }]
keywords = ["ubiquiti", "unifi", "unas", "nas", "home-assistant", "async", "smart", "storage"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9", "yarl>=1.9"]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]              # unifi-unas CLI
mcp = ["mcp>=1.28,<2"]                            # unifi-unas-mcp server
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
]
# Home Assistant integration dev/test. The harness pins a Home Assistant that
# requires Python 3.14.2, while the library itself supports 3.12+ — so the
# marker is what makes this extra resolvable across the whole `requires-python`
# range. Without it a universal resolver (uv) correctly reports the project as
# unsatisfiable; pip only ever noticed because it resolves for one interpreter.
ha = [
  "pytest-homeassistant-custom-component==0.13.340; python_full_version >= '3.14.2'",
]

[project.urls]
Homepage = "https://github.com/LayerTM/unifi-unas-ha"
Issues = "https://github.com/LayerTM/unifi-unas-ha/issues"
Documentation = "https://github.com/LayerTM/unifi-unas-ha/blob/main/docs/API.md"

[project.scripts]
unifi-unas = "aiounas.cli:app"
unifi-unas-mcp = "aiounas.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiounas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PTH", "TID"]

[tool.mypy]
# Library (aiounas) targets 3.12+. The HA integration is checked separately with
# `mypy --python-version 3.14 custom_components/unifi_unas_rest` (needs HA + 3.13+
# syntax), since Home Assistant itself requires Python 3.14.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src/aiounas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/aiounas", "custom_components/unifi_unas_rest"]
