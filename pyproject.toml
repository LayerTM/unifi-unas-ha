[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiounas"
version = "0.1.0"
description = "Async client for the Ubiquiti UniFi UNAS (UniFi Drive) local REST API — non-invasive, read-focused."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "LayerTM" }]
keywords = ["ubiquiti", "unifi", "unas", "nas", "home-assistant", "async", "smart", "storage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9", "yarl>=1.9"]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]              # productized CLI — v2
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
]
# Home Assistant integration dev/test. Requires Python 3.14 (HA 2026.6+).
# pytest-homeassistant-custom-component pins the matching Home Assistant version;
# let the resolver pick the newest that lines up with a stable HA release.
ha = [
  "pytest-homeassistant-custom-component==0.13.340",  # matches stable HA 2026.6.4
]

[project.urls]
Homepage = "https://github.com/LayerTM/unifi-unas-ha"
Issues = "https://github.com/LayerTM/unifi-unas-ha/issues"
Documentation = "https://github.com/LayerTM/unifi-unas-ha/blob/main/docs/API.md"

[project.scripts]
unifi-unas = "aiounas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiounas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PTH", "TID"]

[tool.mypy]
# Library (aiounas) targets 3.12+. The HA integration is checked separately with
# `mypy --python-version 3.14 custom_components/unifi_unas_rest` (needs HA + 3.13+
# syntax), since Home Assistant itself requires Python 3.14.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src/aiounas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/aiounas", "custom_components/unifi_unas_rest"]
