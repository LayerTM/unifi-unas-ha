[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiounas"
dynamic = ["version"]
description = "Async client for the Ubiquiti UniFi UNAS (UniFi Drive) local REST API — non-invasive monitoring with opt-in control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "LayerTM" }]
keywords = ["ubiquiti", "unifi", "unas", "nas", "home-assistant", "async", "smart", "storage"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# Floors are the oldest versions the library works on, proven by the
# `test-minimum-deps` job. aiohttp 3.9.2 is the first to honour `ssl=True` on a
# request, which the certificate-authority TLS mode sends.
dependencies = ["aiohttp>=3.9.2", "yarl>=1.9"]

[project.optional-dependencies]
# typer 0.12 allows any click, and its options break from click 8.3.
cli = ["typer>=0.13", "rich>=13"]              # unifi-unas CLI
mcp = ["mcp>=2"]                                  # unifi-unas-mcp server
# ruff and mypy are not listed: their versions are stated once, hash-locked, in
# `.github/ci-tools/requirements.txt`, which CI and contributors install.
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-socket>=0.7",
  # Declared, not inherited: the TLS tests issue a real handshake against a
  # self-signed certificate they generate, so the pinning is exercised rather
  # than mocked. cryptography arrives transitively today; a transitive
  # dependency is not a contract.
  "cryptography>=43",
]
# Home Assistant integration dev/test. The harness pins a Home Assistant that
# requires Python 3.14.2, while the library itself supports 3.12+ — so the
# marker is what makes this extra resolvable across the whole `requires-python`
# range. Without it a universal resolver (uv) correctly reports the project as
# unsatisfiable; pip only ever noticed because it resolves for one interpreter.
#
# Deliberately a floor and not a pin: an exact pin held CI on Home Assistant
# 2026.6 while users ran 2026.9, so the deprecation warnings core logs against
# this integration could not appear in any test run. A floating harness makes
# those the build's problem instead of the user's. The harness is Home
# Assistant's own, released with each version and pinning it exactly; the CI
# job that installs this extra fails when it lands on anything but the newest
# Home Assistant release, so a harness that stops following core is caught.
ha = [
  "pytest-homeassistant>=2026.11.2; python_full_version >= '3.14.2'",
]

[project.urls]
Homepage = "https://github.com/LayerTM/unifi-unas-ha"
Issues = "https://github.com/LayerTM/unifi-unas-ha/issues"
Documentation = "https://github.com/LayerTM/unifi-unas-ha/blob/main/docs/API.md"

[project.scripts]
unifi-unas = "aiounas.cli:app"
unifi-unas-mcp = "aiounas.mcp:main"

# The version is stated once, in the integration manifest — the file Home
# Assistant and HACS read, and the one a release tag is cut from. Repeating it
# here is what let three files disagree (1.7.5 / 1.7.4 / 1.7.2) with a released
# tag matching only the first.
[tool.hatch.version]
path = "custom_components/unifi_unas_rest/manifest.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/aiounas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PTH", "TID"]

# The CI rule checker keeps its own line layout.
[tool.ruff.lint.per-file-ignores]
".github/scripts/*" = ["E501"]

[tool.ruff.format]
exclude = [".github/scripts/*"]

[tool.mypy]
# Library (aiounas) targets 3.12+. The HA integration is checked separately with
# `mypy --python-version 3.14 custom_components/unifi_unas_rest` (needs HA + 3.13+
# syntax), since Home Assistant itself requires Python 3.14.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
# scripts/ is included because it is not throwaway: smoke.py is the only tool
# that exercises the library against real hardware, and a public-API change
# broke it without any gate noticing.
files = ["src/aiounas", "scripts"]

# An entity platform's package root is the import path Home Assistant's own
# integrations use for its types (`from homeassistant.components.binary_sensor
# import BinarySensorDeviceClass`), whether or not that root re-exports them
# explicitly; 2026.10 dropped the explicit form for some of them.
[[tool.mypy.overrides]]
module = "homeassistant.components.*"
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The Home Assistant harness installs respx, whose pytest plugin imports httpx
# when it loads; core must alias httpx before that import, and plugins load in no
# fixed order, so the run fails at startup whenever respx loads first. These
# tests do not use respx, so its plugin stays off, as in core's own configuration.
addopts = "-q --strict-markers -p no:respx"
testpaths = ["tests"]
# Home Assistant reports the deprecations it catches an integration using through
# its logs, which `tests_ha/conftest.py` watches. Everything else — the standard
# library, aiohttp, the test harness — deprecates through this channel instead,
# and a floating harness is what carries those releases in. An unrelated project
# deprecating something is a real reason for this to go red; scope an `ignore`
# to that warning, with the reason, rather than lowering the setting.
filterwarnings = [
  "error::DeprecationWarning",
  # Core's HTTP server subclasses aiohttp's `web.Application` on purpose and
  # ignores this warning in its own test configuration with the same filter.
  "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
  # `backoff`, which core's frontend loads, is archived upstream with this fixed
  # in an unreleased change; core ignores it with the same filter.
  "ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal in Python 3.16:DeprecationWarning:(backoff._decorator|backoff._async)",
]

[tool.coverage.run]
branch = true
source = ["src/aiounas", "custom_components/unifi_unas_rest"]
# The vendored client is a byte-for-byte copy of `src/aiounas`, kept in step by a
# CI check, and it is measured there by the library suite. The integration suite
# mocks it, so counting it a second time here would put most of the misses in a
# copy nobody intends to exercise from this side.
omit = ["custom_components/unifi_unas_rest/aiounas/*"]

[tool.coverage.report]
# Compare `--cov-fail-under` against the real total, not the rounded one. At the
# default precision coverage rounds first, so 98.65% displays — and compares — as
# 99, and a threshold of 99 passes on a project that has not reached it.
precision = 2
