rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any custom service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any custom service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: >-
      Entities derive from CoordinatorEntity and subscribe through the
      coordinator; they do not subscribe to external library events directly.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: >-
      Core modules are well covered, but some write-path error branches
      (select/switch/update) are below the Silver line-coverage target.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The UNAS console is not discoverable, so there is no discovery to update from.
  discovery:
    status: exempt
    comment: >-
      The UNAS console broadcasts no zeroconf/SSDP/DHCP identity that can be used
      for discovery; setup is manual by host.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: >-
      Consider disabling high-churn rate sensors (network rx/tx, disk
      read/write rate) and recent_events by default.
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: There are no known error states that a repair flow could resolve.
  stale-devices:
    status: todo
    comment: >-
      Disk/pool/share sub-devices that disappear between polls go unavailable
      but are not yet pruned from the device registry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: >-
      Strict mypy runs in this repo's CI, but the integration is not yet
      registered in Home Assistant core's .strict-typing list that the
      hassfest validator checks.
