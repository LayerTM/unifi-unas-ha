rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any custom service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any custom service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: >-
      Entities derive from CoordinatorEntity and subscribe through the
      coordinator; they do not subscribe to external library events directly.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      Every integration module is at or above 95% line coverage (tests_ha/); the
      vendored aiounas client is covered separately by its own suite (tests/,
      90%+ enforced in CI).

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The UNAS console is not discoverable, so there is no discovery to update from.
  discovery:
    status: exempt
    comment: >-
      The UNAS console broadcasts no zeroconf/SSDP/DHCP identity that can be used
      for discovery; setup is manual by host.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: There are no known error states that a repair flow could resolve.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: >-
      Strict mypy runs in this repo's CI, but the integration is not yet
      registered in Home Assistant core's .strict-typing list that the
      hassfest validator checks.
